<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見本イラスト比較</title>
<style>
  body { margin: 0; font-family: "Yu Gothic UI", "Meiryo", sans-serif; background: #fff; color: #2e2722; }
  header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #eee; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 1; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header button { border: 1px solid #ccc; background: #fff; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  header button.on { background: #2e2722; color: #fff; border-color: #2e2722; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 12px; }
  figure { margin: 0; border: 1px solid #eee; border-radius: 10px; overflow: hidden; }
  figure img { display: block; width: 100%; aspect-ratio: 10 / 11; object-fit: contain; background: #fafafa; }
  figure .none { aspect-ratio: 10 / 11; display: grid; place-items: center; color: #aaa; font-size: 12px; background: #fafafa; }
  figcaption { padding: 6px 8px; font-size: 12px; line-height: 1.5; }
  figcaption b { display: block; font-size: 13px; }
  figcaption small { color: #7a6e66; }
  .reg { color: #137c70; } .unreg { color: #b35c00; }
</style>
</head>
<body>
<header>
  <h1>見本イラスト比較（確認用）</h1>
  <button data-v="front" class="on">正面</button><button data-v="side">横</button><button data-v="back">後ろ</button>
</header>
<div class="grid" id="grid"></div>
<script src="../js/data.js"></script>
<script>
  // 似た髪型を同じ向きで並べて、違いが見えるかを確認するためのページ。アプリ本体からは使わない。
  const L = window.HM_LABELS;
  let view = 'front';
  function render() {
    document.getElementById('grid').innerHTML = window.HM_STYLES.map(s => {
      const p = s.params;
      const reg = window.HM_IMAGES[s.id];
      const src = `../img/styles/${s.id}-${view}.png`;
      const spec = `前髪：${p.bangShape === 'none' ? 'ほぼなし' : L.bang[p.bang] + '・' + L.bangShape[p.bangShape]}／耳：${L.ear[p.ear]}／襟足：${L.nape[p.nape]}／刈り上げ：${L.fade[p.fade]}`;
      return `<figure><img src="${src}" alt="" onerror="this.outerHTML='<div class=none>画像なし</div>'">
        <figcaption><b>${s.name}</b><small>${spec}</small><br>
        <span class="${reg ? 'reg' : 'unreg'}">${reg ? '登録済み' : '未登録'}</span></figcaption></figure>`;
    }).join('');
  }
  document.querySelector('header').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    view = b.dataset.v;
    document.querySelectorAll('header button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  render();
</script>
</body>
</html>
